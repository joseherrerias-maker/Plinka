name: Plinka iOS compile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-compile.yml"

permissions:
  contents: read

jobs:
  ios-simulator-build:
    name: Compile iPhone and iPad app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate Pluki app icon
        run: bash ios/scripts/prepare-app-icon.sh
      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Plinka.xcodeproj \
            -scheme Plinka \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PlinkaDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/plinka-build.log"
      - name: Verify Apple-required orientation values in built app
        run: |
          python3 ios/scripts/verify-orientations.py \
            "$RUNNER_TEMP/PlinkaDerivedData/Build/Products/Debug-iphonesimulator/Plinka.app/Info.plist"
