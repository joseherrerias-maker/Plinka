name: Plinka iOS compile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-compile.yml"

permissions:
  contents: read

jobs:
  ios-simulator-build:
    name: Compile iPhone and iPad app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Check saved-song persistence
        run: |
          xcrun swiftc -parse-as-library ios/Plinka/Song.swift ios/scripts/SongStoreChecks.swift -o "$RUNNER_TEMP/song-checks"
          "$RUNNER_TEMP/song-checks"
      - name: Check parent approval behavior
        run: |
          xcrun swiftc -parse-as-library ios/Plinka/ParentApproval.swift ios/scripts/ParentApprovalChecks.swift -o "$RUNNER_TEMP/parent-checks"
          "$RUNNER_TEMP/parent-checks"
      - name: Generate Pluki app icon
        run: bash ios/scripts/prepare-app-icon.sh
      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Plinka.xcodeproj \
            -scheme Plinka \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PlinkaDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/plinka-build.log"
      - name: Verify Apple-required orientation values in built app
        run: |
          python3 ios/scripts/verify-orientations.py \
            "$RUNNER_TEMP/PlinkaDerivedData/Build/Products/Debug-iphonesimulator/Plinka.app/Info.plist"
          python3 ios/scripts/verify-sound-resources.py \
            "$RUNNER_TEMP/PlinkaDerivedData/Build/Products/Debug-iphonesimulator/Plinka.app"
      - name: Verify bundled privacy information
        run: python3 ios/scripts/verify-privacy.py "$RUNNER_TEMP/PlinkaDerivedData/Build/Products/Debug-iphonesimulator/Plinka.app"
      - name: Build and validate release configuration
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/Plinka.xcodeproj -scheme Plinka -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/PlinkaRelease" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/pluki-release.log" 2>&1 || { tail -100 "$RUNNER_TEMP/pluki-release.log"; exit 1; }
          release_app="$RUNNER_TEMP/PlinkaRelease/Build/Products/Release-iphonesimulator/Plinka.app"
          python3 ios/scripts/verify-orientations.py "$release_app/Info.plist"
          python3 ios/scripts/verify-sound-resources.py "$release_app"
          python3 ios/scripts/verify-privacy.py "$release_app"
          python3 - "$release_app/Info.plist" <<'PYCODE'
          import plistlib, re, sys
          from pathlib import Path
          with open(sys.argv[1], 'rb') as f: info = plistlib.load(f)
          project = Path('ios/Plinka.xcodeproj/project.pbxproj').read_text()
          for key, setting in [('PlukiReleaseBuild', 'PLUKI_RELEASE_BUILD'), ('CFBundleShortVersionString', 'MARKETING_VERSION')]:
              expected = re.findall(rf'{setting} = ([^;]+);', project)
              assert expected and all(v == info[key] for v in expected), (key, info.get(key), expected)
          print('Release build label and marketing version verified.')
          PYCODE
      - name: Check video export media
        if: contains(github.event.head_commit.message, '[video-check]')
        timeout-minutes: 10
        run: bash ios/scripts/check-video-export.sh "$RUNNER_TEMP/PlinkaDerivedData/Build/Products/Debug-iphonesimulator/Plinka.app"
      - name: Keep export check videos and frames
        if: always() && contains(github.event.head_commit.message, '[video-check]')
        uses: actions/upload-artifact@v4
        with:
          name: Pluki-video-check
          path: ${{ runner.temp }}/PlukiVideoCheck
          retention-days: 7
      - name: Check keypad and editors on iPhone and iPad
        if: contains(github.event.head_commit.message, '[parent-check]')
        timeout-minutes: 25
        run: |
          brew install xcodegen
          bash ios/scripts/check-parent-keypad.sh "$RUNNER_TEMP/PlinkaDerivedData/Build/Products/Debug-iphonesimulator/Plinka.app"
      - name: Keep parent keypad results
        if: always() && contains(github.event.head_commit.message, '[parent-check]')
        uses: actions/upload-artifact@v4
        with:
          name: Pluki-parent-keypad-check
          path: ${{ runner.temp }}/PlukiParentCheck
          retention-days: 7
      - name: Check staff grid drawing
        if: contains(github.event.head_commit.message, '[grid-check]')
        timeout-minutes: 10
        run: bash ios/scripts/check-staff-grid.sh "$RUNNER_TEMP/PlinkaDerivedData/Build/Products/Debug-iphonesimulator/Plinka.app"
      - name: Keep grid check frames
        if: always() && contains(github.event.head_commit.message, '[grid-check]')
        uses: actions/upload-artifact@v4
        with:
          name: Pluki-grid-check
          path: ${{ runner.temp }}/PlukiGridCheck
          retention-days: 7
