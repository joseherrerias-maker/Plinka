# Plinka iOS: two manually selected workflows (no automatic triggers).
# 1. plinka-ios-compile: unsigned simulator compile, no Apple credentials.
# 2. plinka-ios-testflight: signed device archive and upload to TestFlight.
# The root web demo and GitHub Pages deployment remain unchanged.
# Reuses the existing team's Codemagic Apple Developer Portal integration.
# No Apple private keys belong in this public GitHub repository.
workflows:
  plinka-ios-compile:
    name: Pluki iOS - Compile Only
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Prepare Pluki app icon asset
        script: bash "$CM_BUILD_DIR/ios/scripts/prepare-app-icon.sh"
      - name: Compile Plinka for iOS Simulator (unsigned)
        script: |
          #!/bin/bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild \
            -project "$CM_BUILD_DIR/ios/Plinka.xcodeproj" \
            -scheme "Plinka" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$CM_BUILD_DIR/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/build/plinka-ios-compile.log"
    artifacts:
      - build/plinka-ios-compile.log
      - build/derived/Build/Products/Debug-iphonesimulator/Plinka.app

  plinka-ios-testflight:
    name: Pluki iOS - TestFlight Upload
    instance_type: mac_mini_m2
    max_build_duration: 30
    # Reuse the Apple Developer Portal connection already used by Milo.
    # This reference is a Codemagic integration name, NOT a private key.
    integrations:
      app_store_connect: "Milo Codemagic 2"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.joseherrerias.plinka
    scripts:
      - name: Prepare Pluki app icon asset
        script: bash "$CM_BUILD_DIR/ios/scripts/prepare-app-icon.sh"
      - name: Check signing files and configure Xcode
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          # Requires a Plinka App Store provisioning profile and a shared
          # Apple Distribution certificate in Codemagic Code signing identities.
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed Plinka IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/Plinka.xcodeproj" \
            --scheme "Plinka" \
            --config "Release" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
      - name: Verify orientations in signed IPA before upload
        script: |
          #!/bin/bash
          set -euo pipefail
          IPA="$CM_BUILD_DIR/build/ios/ipa/Plinka.ipa"
          python3 "$CM_BUILD_DIR/ios/scripts/verify-orientations.py" "$IPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        # Upload the signed IPA using the existing Codemagic integration.
        auth: integration
        # Do not submit for external beta review or App Store publication.
        # Internal TestFlight builds are managed in App Store Connect.
        submit_to_testflight: false
        submit_to_app_store: false

  pluki-ios-dual-export:
    name: Pluki Build 3 - TestFlight and iPad ZIP
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: "Milo Codemagic 2"
    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - pluki_app_store
          - pluki_adhoc_ipad
        certificates:
          - "Milo Distribution"
    scripts:
      - name: Prepare icon and signing exports
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/ios/scripts/prepare-app-icon.sh"
          python3 "$CM_BUILD_DIR/ios/scripts/prepare-dual-export.py"
      - name: Create one signed archive
        script: |
          set -euo pipefail
          xcodebuild archive \
            -project "$CM_BUILD_DIR/ios/Plinka.xcodeproj" \
            -scheme Plinka -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Pluki.xcarchive" \
            DEVELOPMENT_TEAM="$(cat "$CM_BUILD_DIR/build/signing-team.txt")" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$(cat "$CM_BUILD_DIR/build/signing-profile.txt")" \
            CURRENT_PROJECT_VERSION="$PROJECT_BUILD_NUMBER"
      - name: Export TestFlight and iPad from the same archive
        script: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Pluki.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/TestFlightExport.plist" \
            -exportPath "$CM_BUILD_DIR/build/testflight"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Pluki.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/AdHocExport.plist" \
            -exportPath "$CM_BUILD_DIR/build/ipad"
          mv "$CM_BUILD_DIR/build/ipad/Plinka.ipa" "$CM_BUILD_DIR/build/ipad/Pluki-iPad-AdHoc.ipa"
          python3 "$CM_BUILD_DIR/ios/scripts/verify-orientations.py" "$CM_BUILD_DIR/build/testflight/Plinka.ipa"
          python3 "$CM_BUILD_DIR/ios/scripts/verify-orientations.py" "$CM_BUILD_DIR/build/ipad/Pluki-iPad-AdHoc.ipa"
          python3 "$CM_BUILD_DIR/ios/scripts/package-ipad.py" \
            "$CM_BUILD_DIR/build/ipad/Pluki-iPad-AdHoc.ipa" "$CM_BUILD_DIR/build/Pluki-iPad-AdHoc.zip"
          touch "$CM_BUILD_DIR/build/exports-verified"
    artifacts:
      - build/testflight/*.ipa
      - build/ipad/Pluki-iPad-AdHoc.ipa
      - build/Pluki-iPad-AdHoc.zip
      - build/Pluki.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      scripts:
        - name: Upload only the TestFlight export
          script: |
            set -euo pipefail
            if [ ! -f "$CM_BUILD_DIR/build/exports-verified" ]; then exit 0; fi
            app-store-connect publish --path "$CM_BUILD_DIR/build/testflight/Plinka.ipa"
